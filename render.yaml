databases:\n  - name: raspb-db\n    databaseName: raspb\n    user: raspb_user\n    plan: free\nservices:\n  - type: web\n    name: raspb-console\n    runtime: python\n    plan: free\n    buildCommand: pip install -r requirements.txt\n    startCommand: gunicorn app:app\n    envVars:\n      - key: DATABASE_URL\n        fromDatabase:\n          name: raspb-db\n          property: connectionString\n      - key: SECRET_KEY\n        generateValue: true\n      - key: OWNER_USERNAME\n        sync: false\n      - key: OWNER_PASSWORD\n        sync: false\n      - key: COOKIE_SECURE\n        value: true\n